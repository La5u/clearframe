<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #000;
      --stroke: #bbb;
    }
    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }
    button,
    input {
      font: inherit;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      color: var(--ink);
    }
    body {
      width: 320px;
      min-height: 340px;
      max-height: 560px;
      margin: 0;
      padding: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .header {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--stroke);
    }
    h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }
    .top-tabs,
    .term-tabs {
      display: flex;
      align-items: center;
      margin: 12px 0;
    }
    .top-tab,
    .term-tab {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .top-tab {
      font-size: 14px;
      font-weight: 500;
    }
    .top-tab:not(:last-child)::after,
    .term-tab:not(:last-child)::after {
      content: "|";
      padding: 0 8px;
      font-weight: 400;
    }
    .top-tab.active,
    .term-tab.active {
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .top-panel,
    .term-panel {
      display: none;
    }
    .top-panel.active,
    .term-panel.active {
      display: block;
    }
    .count-row,
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--stroke);
    }
    .count-value,
    .setting-title {
      font-weight: 700;
    }
    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
    }
    .toggle .track {
      position: absolute;
      inset: 0;
      border: 1px solid var(--ink);
      background: #fff;
    }
    .toggle .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: var(--ink);
      transition: transform 0.12s ease;
    }
    .toggle input:checked + .track::after {
      transform: translateX(18px);
    }
    .section-title {
      margin: 12px 0 8px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .color-group {
      margin-bottom: 9px;
      padding: 7px;
      border: 1px solid var(--stroke);
    }
    .color-group-title {
      margin: 0 0 6px 2px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .type-list {
      min-height: 24px;
      padding: 3px;
    }
    .type-chip {
      display: inline-flex;
      align-items: center;
      margin: 2px;
      padding: 5px 8px;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }
    .type-chip.disabled {
      opacity: 0.4;
    }
    .type-chip.dragging {
      opacity: 0.5;
    }
    .type-chip-label {
      pointer-events: none;
    }
    .drop-zone {
      border: 2px dashed transparent;
    }
    .drop-zone.drag-over {
      border-color: var(--ink);
    }
    #reset-btn {
      margin-top: 4px;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    #feedback-tools-actions {
      display: none;
      padding: 10px 0;
      border-bottom: 1px solid var(--stroke);
    }
    #copy-feedback {
      padding: 6px 8px;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
    }
    #feedback-copy-status { margin-left: 8px; font-size: 12px; }
    .muted {
      color: var(--ink);
      font-size: 13px;
    }
    .term-tabs {
      flex-wrap: wrap;
      margin-top: 0;
    }
    .term-tab {
      font-size: 13px;
    }
    .term-list {
      max-height: 300px;
      overflow: auto;
      border-top: 1px solid var(--stroke);
      border-bottom: 1px solid var(--stroke);
      padding: 7px 0;
    }
    .term-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 5px 2px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .term-row:hover {
      text-decoration: underline;
    }
    .term-count {
      color: var(--ink);
      font-weight: 700;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px solid var(--stroke);
      color: var(--ink);
      font-size: 12px;
    }
    .footer a {
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>ClearFrame</h3>
  </div>
  <div class="content">
    <div class="top-tabs" role="tablist" aria-label="ClearFrame sections">
      <button class="top-tab active" id="general-tab" type="button" role="tab" aria-selected="true" aria-controls="general-panel">General</button>
      <button class="top-tab" id="customize-tab" type="button" role="tab" aria-selected="false" aria-controls="customize-panel">Customize</button>
      <button class="top-tab" id="detected-tab" type="button" role="tab" aria-selected="false" aria-controls="detected-panel">Detected</button>
    </div>
    <div class="top-panel active" id="general-panel" role="tabpanel" aria-labelledby="general-tab">
      <div class="count-row">
        <span>Detected on page</span>
        <span class="count-value" id="detected-count">(0)</span>
      </div>
      <div class="setting-row">
        <span class="setting-title">Reword</span>
        <label class="toggle" aria-label="Reword matched terms">
          <input type="checkbox" id="replace-terms">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-title">Remove mode</span>
        <label class="toggle" aria-label="Remove matched terms marked for deletion">
          <input type="checkbox" id="remove-terms">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-title">Monochrome highlights</span>
        <label class="toggle" aria-label="Use one highlight color">
          <input type="checkbox" id="monochrome">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-title">Feedback tools</span>
        <label class="toggle" aria-label="Enable local feedback and text suggestions">
          <input type="checkbox" id="feedback-enabled">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>
      <div id="feedback-tools-actions">
        <button id="copy-feedback" type="button">Copy saved feedback</button>
        <span id="feedback-copy-status" aria-live="polite"></span>
      </div>
    </div>
    <div class="top-panel" id="customize-panel" role="tabpanel" aria-labelledby="customize-tab">
      <div class="section-title">Types</div>
      <div id="color-groups"></div>
      <button id="reset-btn" type="button">Reset colors</button>
      <p class="muted">Tap a type to enable or disable it. Drag it to change its color.</p>
    </div>
    <div class="top-panel" id="detected-panel" role="tabpanel" aria-labelledby="detected-tab">
      <div class="section-title">Detected words</div>
      <div id="term-tabs" class="term-tabs"></div>
      <div id="term-panels"></div>
    </div>
  </div>
  <div class="footer">
    <span id="popup-version">v1.0.0</span>
    <a id="github-link" href="https://github.com/la5u/clearframe" target="_blank" rel="noreferrer">GitHub</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
